<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="logo" aria-hidden="true">✦</div>
      <p class="eyebrow">STUDENT TOOLKIT</p>
      <h1>Marks Calculator</h1>
      <p class="subtitle">Enter your marks and get your result instantly.</p>
    </header>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Your details</h2>
      <form id="marks-form">
        <label for="student-name">Student name</label>
        <input id="student-name" name="student-name" type="text" placeholder="Enter your name" maxlength="60" required>

        <div class="section-heading">
          <h2>Subject marks</h2>
          <span>Out of 100 each</span>
        </div>
        <div class="subjects">
          <div class="field">
            <label for="maths">Mathematics</label>
            <input id="maths" name="maths" type="number" min="0" max="100" step="0.5" placeholder="0–100" required>
          </div>
          <div class="field">
            <label for="physics">Physics</label>
            <input id="physics" name="physics" type="number" min="0" max="100" step="0.5" placeholder="0–100" required>
          </div>
          <div class="field">
            <label for="chemistry">Chemistry</label>
            <input id="chemistry" name="chemistry" type="number" min="0" max="100" step="0.5" placeholder="0–100" required>
          </div>
          <div class="field">
            <label for="programming">Programming</label>
            <input id="programming" name="programming" type="number" min="0" max="100" step="0.5" placeholder="0–100" required>
          </div>
          <div class="field">
            <label for="english">English</label>
            <input id="english" name="english" type="number" min="0" max="100" step="0.5" placeholder="0–100" required>
          </div>
        </div>
        <p id="error-message" class="error" role="alert" hidden></p>
        <button type="submit">Calculate result <span aria-hidden="true">→</span></button>
        <button type="reset" class="reset-button">Clear form</button>
      </form>
    </section>

    <section id="result" class="card result-card" aria-live="polite" hidden>
      <div class="result-top">
        <div>
          <p class="eyebrow">RESULT SUMMARY</p>
          <h2 id="result-name">Student</h2>
        </div>
        <span id="result-status" class="status">PASS</span>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Percentage</span>
          <strong id="percentage">0%</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Total marks</span>
          <strong id="total">0 / 500</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Grade</span>
          <strong id="grade">A</strong>
        </div>
      </div>
      <h3>Subject breakdown</h3>
      <div id="breakdown" class="breakdown"></div>
      <button id="print-button" type="button" class="print-button">Print result</button>
    </section>

    <footer>Made for learning · HTML, CSS &amp; JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
